<!-- Typefaces: IBM Plex (body + mono) for the document, VT323 for terminal chrome. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
  href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=VT323&display=swap"
  rel="stylesheet">

<!-- "On this page" right-rail TOC, built from the page's own headings (a la
     context7 / Mintlify). No plugin: just-the-docs already gives headings ids. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var content = document.querySelector(".main-content");
    var wrap = document.querySelector(".main-content-wrap");
    if (!content || !wrap) return;
    var heads = content.querySelectorAll("h2[id], h3[id]");
    if (heads.length < 2) return;

    var aside = document.createElement("aside");
    aside.className = "toc-rail";
    aside.setAttribute("aria-label", "On this page");

    var ul = document.createElement("ul");
    heads.forEach(function (h) {
      var li = document.createElement("li");
      li.className = "toc-" + h.tagName.toLowerCase();
      var a = document.createElement("a");
      a.href = "#" + h.id;
      // Strip the trailing anchor-link glyph just-the-docs injects.
      a.textContent = h.textContent.replace(/\s*$/, "");
      li.appendChild(a);
      ul.appendChild(li);
    });

    var title = document.createElement("div");
    title.className = "toc-rail-title";
    title.textContent = "On this page";
    aside.appendChild(title);
    aside.appendChild(ul);

    wrap.appendChild(aside);
    wrap.classList.add("has-toc");

    // Highlight the section currently in view.
    var links = aside.querySelectorAll("a");
    var byId = {};
    links.forEach(function (a) { byId[a.getAttribute("href").slice(1)] = a; });
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          links.forEach(function (a) { a.classList.remove("active"); });
          var link = byId[e.target.id];
          if (link) link.classList.add("active");
        }
      });
    }, { rootMargin: "0px 0px -75% 0px" });
    heads.forEach(function (h) { observer.observe(h); });
  });
</script>

<!-- Prev / next page footer, built from the sidebar order (which already
     reflects the grouped sections), so every page gets context7-style
     pagination without hand-maintained links. -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var content = document.querySelector(".main-content");
    if (!content) return;
    var links = Array.prototype.slice.call(
      document.querySelectorAll("#site-nav .nav-list-link:not(.external)")
    );
    if (links.length < 2) return;

    // The theme marks the current page's link with `.active` and strips its
    // href, so match on that; fall back to resolving the href (covers the page
    // load before the theme's own script has run).
    function norm(p) { return p.replace(/index\.html$/, "").replace(/\/$/, ""); }
    var here = norm(location.pathname);
    var idx = links.findIndex(function (a) {
      if (a.classList.contains("active")) return true;
      var href = a.getAttribute("href");
      return href && norm(new URL(href, location.href).pathname) === here;
    });
    if (idx < 0) return;

    var prev = links[idx - 1];
    var next = links[idx + 1];
    if (!prev && !next) return;

    function cell(link, dir) {
      var a = document.createElement("a");
      a.href = link.getAttribute("href");
      a.className = "page-nav-" + dir;
      var label = document.createElement("span");
      label.className = "page-nav-label";
      label.textContent = dir === "prev" ? "← Previous" : "Next →";
      var title = document.createElement("span");
      title.className = "page-nav-title";
      title.textContent = link.textContent.trim();
      a.appendChild(label);
      a.appendChild(title);
      return a;
    }

    var nav = document.createElement("nav");
    nav.className = "page-nav";
    nav.setAttribute("aria-label", "Pagination");
    if (prev) {
      nav.appendChild(cell(prev, "prev"));
    } else {
      var spacer = document.createElement("span");
      spacer.style.flex = "1 1 0";
      nav.appendChild(spacer);
    }
    if (next) nav.appendChild(cell(next, "next"));
    content.appendChild(nav);
  });
</script>
