<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">Council terminal grid with four AI agent panes</title>
  <desc id="desc">A dark terminal UI showing Claude, Codex, Cursor, and Copilot panes with a broadcast composer at the bottom.</desc>
  <rect width="1280" height="760" fill="#090b0f"/>
  <text x="32" y="42" font-family="SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700" fill="#ff79d6">Council</text>
  <text x="132" y="42" font-family="SFMono-Regular,Consolas,monospace" font-size="18" fill="#f8f8f2">Agents: claude, codex, cursor, copilot</text>
  <text x="32" y="72" font-family="SFMono-Regular,Consolas,monospace" font-size="16" fill="#50fa7b">target all · run 20260606-143000 · phase plan · page 1/1</text>

  <g font-family="SFMono-Regular,Consolas,monospace">
    <rect x="24" y="100" width="604" height="250" fill="#0f1117" stroke="#ffb86c" stroke-width="2" rx="8"/>
    <text x="48" y="132" font-size="18" font-weight="700" fill="#ffb86c">› claude-worker [running] ✓plan</text>
    <text x="48" y="174" font-size="17" fill="#f8f8f2">Plan saved to .council/runs/.../plans/claude-worker.md</text>
    <text x="48" y="214" font-size="17" fill="#bfbfbf">- touch internal/orchestrate/controller.go</text>
    <text x="48" y="246" font-size="17" fill="#bfbfbf">- add resume-state tests</text>
    <text x="48" y="278" font-size="17" fill="#bfbfbf">- document phase recovery</text>

    <rect x="652" y="100" width="604" height="250" fill="#0f1117" stroke="#8be9fd" stroke-width="2" rx="8"/>
    <text x="676" y="132" font-size="18" font-weight="700" fill="#8be9fd">› codex-worker [running] ✓plan</text>
    <text x="676" y="174" font-size="17" fill="#f8f8f2">I’ll keep the state model small and explicit.</text>
    <text x="676" y="214" font-size="17" fill="#bfbfbf">Artifacts become the source of truth.</text>
    <text x="676" y="246" font-size="17" fill="#bfbfbf">Vote assignments must be persisted.</text>

    <rect x="24" y="374" width="604" height="250" fill="#0f1117" stroke="#50fa7b" stroke-width="2" rx="8"/>
    <text x="48" y="406" font-size="18" font-weight="700" fill="#50fa7b">› cursor-reviewer [running]</text>
    <text x="48" y="448" font-size="17" fill="#f8f8f2">Waiting for plans before voting...</text>
    <text x="48" y="488" font-size="17" fill="#bfbfbf">Reviewer role: vote + review only</text>

    <rect x="652" y="374" width="604" height="250" fill="#0f1117" stroke="#bd93f9" stroke-width="2" rx="8"/>
    <text x="676" y="406" font-size="18" font-weight="700" fill="#bd93f9">› copilot-reviewer [running]</text>
    <text x="676" y="448" font-size="17" fill="#f8f8f2">Ready to rank anonymized plans.</text>
    <text x="676" y="488" font-size="17" fill="#bfbfbf">Self-votes are excluded automatically.</text>
  </g>

  <rect x="24" y="656" width="1232" height="72" fill="#12151d" stroke="#44475a" stroke-width="2" rx="8"/>
  <text x="48" y="700" font-family="SFMono-Regular,Consolas,monospace" font-size="22" font-weight="700" fill="#f1fa8c">all › /plan @examples/issues/retry-backoff.md</text>
  <text x="32" y="744" font-family="SFMono-Regular,Consolas,monospace" font-size="15" fill="#8a8f98">Enter send · F2 direct · Ctrl+G overview · Ctrl+N/Ctrl+P page · Ctrl+X quit</text>
</svg>
