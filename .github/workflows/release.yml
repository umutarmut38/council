name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # For build provenance attestations on the release archives.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build archives
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          commit="$(git rev-parse --short HEAD)"
          date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/umutarmut38/council/internal/version.Version=${version} -X github.com/umutarmut38/council/internal/version.Commit=${commit} -X github.com/umutarmut38/council/internal/version.Date=${date}"

          mkdir -p dist
          build() {
            local goos="$1"
            local goarch="$2"
            local ext=""
            if [[ "$goos" == "windows" ]]; then ext=".exe"; fi
            local name="council_${version}_${goos}_${goarch}"
            mkdir -p "dist/${name}"
            GOOS="$goos" GOARCH="$goarch" go build -ldflags "$ldflags" -o "dist/${name}/council${ext}" ./cmd/council
            cp README.md LICENSE "dist/${name}/"
            if [[ "$goos" == "windows" ]]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              (cd dist && tar -czf "${name}.tar.gz" "${name}")
            fi
          }

          build darwin amd64
          build darwin arm64
          build linux amd64
          build linux arm64
          build windows amd64
          build windows arm64

          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Verifying the artifacts

            ```sh
            sha256sum -c checksums.txt --ignore-missing
            gh attestation verify <archive> --repo ${{ github.repository }}
            ```

            > **Note:** Windows binaries are experimental — the Windows build is
            > verified in CI, but the full test suite does not yet gate it.
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set; skipping Homebrew tap update."
            exit 0
          fi

          tap_repo="umutarmut38/homebrew-council"
          work="$(mktemp -d)"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${tap_repo}.git" "$work"

          mkdir -p "$work/Formula"
          version="${VERSION#v}"
          formula_path="$work/Formula/council.rb"
          formula_class="Council"
          if [[ "$version" == *-* ]]; then
            formula_suffix="$version"
            class_suffix="$(awk -F- '{
              out = $1
              gsub(/\./, "", out)
              for (i = 2; i <= NF; i++) {
                part = $i
                gsub(/\./, "", part)
                out = out toupper(substr(part, 1, 1)) substr(part, 2)
              }
              print out
            }' <<<"$formula_suffix")"
            formula_path="$work/Formula/council@${formula_suffix}.rb"
            formula_class="CouncilAT${class_suffix}"
          fi

          bash packaging/homebrew/render_formula.sh "$VERSION" dist/checksums.txt "$formula_class" > "$formula_path"

          cd "$work"
          if git diff --quiet; then
            echo "Formula already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula
          git commit -m "council ${VERSION}"
          git push origin HEAD
