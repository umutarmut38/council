name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Native Windows support is experimental: its job may fail without
    # blocking the build. The required windows-smoke job below still
    # guarantees the Windows binary compiles.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Go test
        run: go test ./...

      # PTY reads, delayed submits, and TUI messages all run on goroutines;
      # the race detector is the cheapest way to catch regressions there.
      - name: Go test (race)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Go vet
        run: go vet ./...

      - name: Build
        shell: bash
        run: |
          mkdir -p bin
          suffix=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then suffix=".exe"; fi
          go build -o "bin/council${suffix}" ./cmd/council

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: council-${{ runner.os }}-${{ runner.arch }}
          path: bin/*

  windows-smoke:
    # Must pass: releases ship Windows binaries, so the Windows build cannot
    # be allowed to rot even while the Windows test suite is experimental.
    name: Windows cross-build smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile for Windows
        run: |
          GOOS=windows GOARCH=amd64 go build -o /dev/null ./...
          GOOS=windows GOARCH=arm64 go build -o /dev/null ./...
